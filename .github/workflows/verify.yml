name: verify

on:
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks necesita historial

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias de calidad
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy pip-audit

      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.19.3/gitleaks_8.19.3_linux_x64.tar.gz | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/gitleaks

      - name: Ejecutar compuertas de calidad
        run: python scripts/verify.py
