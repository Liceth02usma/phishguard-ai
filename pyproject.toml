# Configuración de herramientas de calidad para PhishGuard-AI.
# Esta spec (000-calidad-base) configura las compuertas sobre el código nuevo
# (scripts/ y tests/). Lint/typecheck sobre src/ se habilita progresivamente
# en las specs 01-15 que refactorizan el código existente.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ac(id: str): asocia una prueba a un criterio de aceptación AC-XXX-NN (Art. II.6)",
]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
# Excepción aprobada por usuario para spec 000: cobertura real 79.72%.
# Objetivo constitucional (Art. II.3): 80%. Ver informe final.
fail_under = 79
# Misma decisión D3 (auditoría 2026-11-17) que ruff/mypy: los scripts ad-hoc
# de diagnóstico one-off (acceden a APIs reales, no son ejecutables por
# tests unitarios) quedan fuera del gate de cobertura, igual que de lint y
# tipos. El gate sigue midiendo verify.py, check_* y entrenar_*.
omit = [
    "scripts/_*.py",
    "scripts/test_*.py",
    "scripts/e2e_*.py",
    "scripts/reentrenar_*.py",
    "scripts/verificar_modulos.py",
    "scripts/verificar_integraciones.py",
    "scripts/listar_proyectos_jira.py",
]

[tool.ruff]
line-length = 100
src = ["scripts", "tests/unit"]
extend-exclude = [
    "src",
    "notebooks",
    "data",
    "workflow",
    "tests/test_pipeline.py",
    "tests/fixtures",
    ".venv",
    "build",
    "dist",
    # Auditoría 2026-11-17 (decisión D3): scripts ad-hoc de diagnóstico
    # one-off. El gate de calidad solo cubre verify.py, check_* y entrenar_*.
    "scripts/_*.py",
    "scripts/test_*.py",
    "scripts/e2e_*.py",
    "scripts/reentrenar_*.py",
    "scripts/verificar_modulos.py",
    "scripts/verificar_integraciones.py",
    "scripts/listar_proyectos_jira.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert está bien en pruebas
# Query() en defaults es el patrón estándar de FastAPI (auditoría 2026-11-17)
"src/api/routers/*.py" = ["B008"]

[tool.mypy]
strict = true
files = ["scripts", "tests/unit"]
# "src/" NO se excluye: las pruebas importan src.level2_agent.* y mypy sigue
# esos imports (resolviéndolos como src.level2_agent.*). El legado src/ se
# exime con ignore_errors (override src.*); el código nuevo de la spec 002
# (models.py y normalizacion/) se type-checkea estricto con los overrides
# de abajo, que van después y por eso prevalecen.
exclude = [
    "notebooks/",
    "data/",
    "workflow/",
    "tests/test_pipeline.py",
    # Auditoría 2026-11-17 (decisión D3, mismos patrones que ruff):
    # scripts ad-hoc de diagnóstico one-off fuera de ambos gates.
    "scripts/_.*\\.py",
    "scripts/test_.*\\.py",
    "scripts/e2e_.*\\.py",
    "scripts/reentrenar_.*\\.py",
    "scripts/verificar_modulos\\.py",
    "scripts/verificar_integraciones\\.py",
    "scripts/listar_proyectos_jira\\.py",
]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = ["no-untyped-def", "attr-defined"]

# Código legado de src/: las pruebas de spec lo importan, pero su tipado
# estricto se habilita progresivamente en las specs 01-15 que lo refactorizan
# (decisión de alcance de spec 000; no se baja ningún umbral para scripts/).
[[tool.mypy.overrides]]
module = "src.*"
ignore_errors = true

# Spec 003: el codigo nuevo/modificado en src/ SÍ se type-checkea estricto
# (Art. III.4/IV.1d). Los overrides posteriores ganan a los anteriores.
[[tool.mypy.overrides]]
module = ["src.level2_agent.models", "src.level2_agent.normalizacion", "src.level2_agent.normalizacion.*"]
ignore_errors = false
strict = true

# Spec 003: el paquete banderas/ tambien se type-checkea estricto (Art. III.4).
[[tool.mypy.overrides]]
module = ["src.level2_agent.banderas", "src.level2_agent.banderas.*"]
ignore_errors = false
strict = true

# Spec 004: el paquete analisis_urls SÍ se type-checkea estricto (Art. III.4).
[[tool.mypy.overrides]]
module = ["src.level2_agent.analisis_urls", "src.level2_agent.analisis_urls.*"]
ignore_errors = false
strict = true

# Spec 005: el paquete adjuntos/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.adjuntos", "src.level2_agent.adjuntos.*"]
ignore_errors = false
strict = true

# Spec 006: el paquete virustotal/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.virustotal", "src.level2_agent.virustotal.*"]
ignore_errors = false
strict = true

# Spec 008: el paquete decision/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.decision", "src.level2_agent.decision.*"]
ignore_errors = false
strict = true

# Spec 009: el paquete agente/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.agente", "src.level2_agent.agente.*"]
ignore_errors = false
strict = true

# Spec 010: el paquete acciones/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.acciones", "src.level2_agent.acciones.*"]
ignore_errors = false
strict = true

# Spec 011: el paquete persistencia/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.persistencia", "src.level2_agent.persistencia.*"]
ignore_errors = false
strict = true

# Spec 012: el paquete api/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.api", "src.api.*"]
ignore_errors = false
strict = true

# Dependencias de spec 006 sin stubs de tipo (Art. III.8: deps fijadas).
[[tool.mypy.overrides]]
module = ["httpx.*", "httpcore.*"]
ignore_missing_imports = true

# Dependencias de spec 005 sin stubs de tipo (Art. III.8: deps fijadas).
[[tool.mypy.overrides]]
module = ["filetype.*", "oletools.*", "oletools.olevba.*"]
ignore_missing_imports = true

# Spec 007: scoring con clasificador lineal se type-checkea estricto (Art. III.4).
[[tool.mypy.overrides]]
module = ["src.level3_logic.scoring", "src.level3_logic.scoring.*", "src.level3_logic.modelo"]
ignore_errors = false
strict = true
