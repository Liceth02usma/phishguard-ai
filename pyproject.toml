# Configuración de herramientas de calidad para PhishGuard-AI.
# Esta spec (000-calidad-base) configura las compuertas sobre el código nuevo
# (scripts/ y tests/). Lint/typecheck sobre src/ se habilita progresivamente
# en las specs 01-15 que refactorizan el código existente.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ac(id: str): asocia una prueba a un criterio de aceptación AC-XXX-NN (Art. II.6)",
]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
# Excepción aprobada por usuario para spec 000: cobertura real 79.72%.
# Objetivo constitucional (Art. II.3): 80%. Ver informe final.
fail_under = 79

[tool.ruff]
line-length = 100
src = ["scripts", "tests/unit"]
extend-exclude = [
    "src",
    "notebooks",
    "data",
    "workflow",
    "tests/test_pipeline.py",
    "tests/fixtures",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert está bien en pruebas

[tool.mypy]
strict = true
files = ["scripts", "tests/unit"]
# "src/" NO se excluye: las pruebas importan src.level2_agent.* y mypy sigue
# esos imports (resolviéndolos como src.level2_agent.*). El legado src/ se
# exime con ignore_errors (override src.*); el código nuevo de la spec 002
# (models.py y normalizacion/) se type-checkea estricto con los overrides
# de abajo, que van después y por eso prevalecen.
exclude = ["notebooks/", "data/", "workflow/", "tests/test_pipeline.py"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = ["no-untyped-def", "attr-defined"]

# Código legado de src/: las pruebas de spec lo importan, pero su tipado
# estricto se habilita progresivamente en las specs 01-15 que lo refactorizan
# (decisión de alcance de spec 000; no se baja ningún umbral para scripts/).
[[tool.mypy.overrides]]
module = "src.*"
ignore_errors = true

# Spec 002: el código nuevo/modificado en src/ SÍ se type-checkea estricto
# (Art. III.4/IV.1d). Los overrides posteriores ganan a los anteriores.
[[tool.mypy.overrides]]
module = ["src.level2_agent.models", "src.level2_agent.normalizacion", "src.level2_agent.normalizacion.*"]
ignore_errors = false
strict = true

# Spec 005: el paquete adjuntos/ se type-checkea estricto (Art. III.4/IV.1d).
[[tool.mypy.overrides]]
module = ["src.level2_agent.adjuntos", "src.level2_agent.adjuntos.*"]
ignore_errors = false
strict = true

# Dependencias de spec 005 sin stubs de tipo (Art. III.8: deps fijadas).
[[tool.mypy.overrides]]
module = ["filetype.*", "oletools.*", "oletools.olevba.*"]
ignore_missing_imports = true
